<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتبع الموقع - تجربة شخصية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 2rem 1rem; }
  .app { background: white; border-radius: 16px; padding: 1.5rem; max-width: 420px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
  h1 { font-size: 18px; margin-bottom: 1.5rem; color: #111; }
  .id-box { background: #f0f0f0; border-radius: 10px; padding: 0.75rem 1rem; font-family: monospace; font-size: 22px; letter-spacing: 3px; text-align: center; color: #111; margin-bottom: 1rem; }
  .label { font-size: 12px; color: #888; margin-bottom: 3px; }
  .value { font-size: 15px; font-weight: bold; color: #111; margin-bottom: 0.75rem; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 12px; border-radius: 8px; margin-bottom: 1rem; }
  .waiting { background: #eee; color: #666; }
  .loading { background: #fff3cd; color: #856404; }
  .success { background: #d4edda; color: #155724; }
  .error { background: #f8d7da; color: #721c24; }
  .map-area { background: #f8f8f8; border-radius: 10px; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #aaa; font-size: 14px; margin-bottom: 1rem; border: 1px dashed #ddd; }
  .map-link { display: block; text-align: center; padding: 10px; background: #e8f4fd; color: #0066cc; border-radius: 8px; text-decoration: none; font-size: 14px; margin-bottom: 1rem; }
  .map-link:hover { background: #d0eaf8; }
  .row { display: flex; gap: 1rem; }
  .col { flex: 1; }
  button { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; margin-bottom: 0.75rem; }
  .btn-main { background: #1a73e8; color: white; }
  .btn-main:hover { background: #1557b0; }
  .btn-reset { background: #f0f0f0; color: #333; }
  .btn-reset:hover { background: #e0e0e0; }
  .note { font-size: 12px; color: #999; text-align: center; padding: 0.75rem; background: #f9f9f9; border-radius: 8px; }
  .acc-bar { height: 6px; background: #eee; border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .acc-fill { height: 100%; background: #28a745; border-radius: 3px; transition: width 0.5s; }
  #loc-data { display: none; }
</style>
</head>
<body>
<div class="app">
  <h1>📍 تجربة تتبع الموقع</h1>

  <div class="label">رمزك التعريفي</div>
  <div class="id-box" id="device-id">—</div>

  <div class="status waiting" id="status-badge">⏳ في انتظار التفعيل</div>

  <div id="loc-pending" class="map-area">
    🗺️<span>اضغط "تحديد موقعي" للبدء</span>
  </div>

  <div id="loc-data">
    <div class="row">
      <div class="col">
        <div class="label">خط العرض</div>
        <div class="value" id="lat">—</div>
      </div>
      <div class="col">
        <div class="label">خط الطول</div>
        <div class="value" id="lng">—</div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <div class="label">الدقة</div>
        <div class="value" id="acc">—</div>
        <div class="acc-bar"><div class="acc-fill" id="acc-bar" style="width:0%"></div></div>
      </div>
      <div class="col">
        <div class="label">المصدر</div>
        <div class="value" id="source">—</div>
      </div>
    </div>
    <div class="label" style="margin-top:8px;">آخر تحديث</div>
    <div class="value" id="timestamp">—</div>
    <a class="map-link" id="map-link" href="#" target="_blank">🗺️ عرض على خريطة Google</a>
  </div>

  <button class="btn-main" onclick="getLocation()">📍 تحديد موقعي</button>
  <button class="btn-reset" onclick="resetAll()">🔄 رمز جديد</button>

  <div class="note">🔒 موقعك لا يُرسل لأي خادم — هذا مثال محلي تجريبي فقط</div>
</div>

<script>
  function genId() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let id = '';
    for (let i = 0; i < 8; i++) {
      if (i === 4) id += '-';
      id += chars[Math.floor(Math.random() * chars.length)];
    }
    return id;
  }

  let deviceId = localStorage.getItem('demo_device_id') || genId();
  localStorage.setItem('demo_device_id', deviceId);
  document.getElementById('device-id').textContent = deviceId;

  function setStatus(type, text) {
    const el = document.getElementById('status-badge');
    el.className = 'status ' + type;
    el.textContent = text;
  }

  function getLocation() {
    if (!navigator.geolocation) {
      setStatus('error', '❌ المتصفح لا يدعم تحديد الموقع');
      return;
    }
    setStatus('loading', '⏳ جاري تحديد الموقع...');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        const acc = Math.round(pos.coords.accuracy);
        const now = new Date().toLocaleTimeString('ar-DZ');

        document.getElementById('lat').textContent = lat;
        document.getElementById('lng').textContent = lng;
        document.getElementById('acc').textContent = acc + ' متر';
        document.getElementById('timestamp').textContent = now;
        document.getElementById('source').textContent = acc < 50 ? '📡 GPS دقيق' : acc < 300 ? '📶 Wi-Fi' : '📱 أبراج خلوية';
        document.getElementById('acc-bar').style.width = Math.max(10, Math.min(100, 100 - Math.round(acc / 10))) + '%';
        document.getElementById('map-link').href = `https://www.google.com/maps?q=${lat},${lng}`;

        document.getElementById('loc-pending').style.display = 'none';
        document.getElementById('loc-data').style.display = 'block';
        setStatus('success', '✅ تم تحديد الموقع بنجاح');
      },
      (err) => {
        const msgs = { 1: '❌ تم رفض الإذن — فعّل الموقع من إعدادات المتصفح', 2: '❌ تعذر تحديد الموقع', 3: '❌ انتهت المهلة' };
        setStatus('error', msgs[err.code] || '❌ خطأ غير معروف');
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  function resetAll() {
    localStorage.removeItem('demo_device_id');
    deviceId = genId();
    localStorage.setItem('demo_device_id', deviceId);
    document.getElementById('device-id').textContent = deviceId;
    document.getElementById('loc-pending').style.display = 'flex';
    document.getElementById('loc-data').style.display = 'none';
    setStatus('waiting', '⏳ في انتظار التفعيل');
  }
</script>
</body>
</html>
